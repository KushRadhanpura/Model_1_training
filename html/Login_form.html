<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
  
</head>
<body>
    <header>
        <h1>Student Registration Form</h1>

    </header>
    <image src="download.png"></image>
    
    <nav>
        <a href="home/">Home</a> |
        <a href="signup/">Signup</a> |
        <a href="signin/">signin</a> |
        <a href="aboutus/">About us</a> |
        <a href="contact/">Contact us</a>

    </nav>
    <form>
        <lable for="fname">First name:</lable>
        <input type="text" id="fname" name="fname"><br><br>
        <label for="Enrollment">Enrollment No:</label> 
        <input type="text" id="enrollment" name="enrollment">
        <br><br>
        <lable for="branch">Branch:</lable>
        <select id="branch" name="branch">
            <option value="cse">CSE</option>
            <option value="iT">IT</option>
            <option value="ai-ml">AIML</option>
            <option value="cyber security">Cyber security</option>
        </select><br><br>
        <label for="div">Division:</label>
        <input type="text" id="div" name="div"><br><br>
        
        <label for="gender">Gender:</label>
        <input type="radio" id="gender" name="gender" value="male";>
        <label for="male">Male</label>
        <input type="radio" id="gender" name="gender" value="female">
        <label for="female">Female</label><br><br>
        <lable for="mobile">Mobile Number:</lable>
        <input type="text" id="mobile" name="mobile"><br><br>
        <lable for="emailid">Email-id</lable>
        <input type="email" id="emailid" name="emailid"><br><br>
        <label type="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>
        <lable for="photo">photo Uploaded Here:</lable><br>
        <input type="file" id="photo" name="photo"><br><br>
        <label for="remarks">Remarks:</label>
        <input type="textarea" id="remarks" name="remarks"><br><br>
        <input type="submit" value="submit">
        <input type="reset">
        

</form>
    
</body>
</html>
