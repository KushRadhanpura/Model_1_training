<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah & James - Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Montserrat:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #fdfaf5; /* Ethereal Cream */
            color: #333;
            overflow-x: hidden;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(rgba(255,255,255,0.6), rgba(255,255,255,0.6)),
                        url('https://images.unsplash.com/photo-1518199266791-c399460a679d?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            opacity: 0.4;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 100px 20px;
            text-align: center;
        }

        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 10vw, 5.5rem);
            font-style: italic;
            color: #d4af37; /* Wedding Gold */
            margin-bottom: 10px;
        }

        .sub-text {
            letter-spacing: 5px;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 40px;
        }

        
        .gallery {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 60px;
        }

        .gallery img {
            width: 280px;
            height: 380px;
            object-fit: cover;
            border-radius: 15px;
            border: 8px solid white;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        
        .info-card {
            background: white;
            padding: 50px;
            max-width: 650px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 60px;
        }

        .info-card p {
            margin: 15px 0;
            line-height: 1.6;
        }

        .highlight-bold {
            font-weight: 700;
            font-size: 1.2rem;
            color: #000;
        }

        .venue-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: #d4af37;
            font-weight: 600;
        }

        .map-section {
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 5px solid white;
        }

        iframe { width: 100%; height: 350px; border: 0; }

        .audio-player {
            margin-top: 40px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="main-container">
        <div class="header">
            <p class="sub-text">Join us for the wedding of</p>
            <h1>Sarah & James</h1>
        </div>

        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=600" alt="Couple">
            <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&q=80&w=600" alt="Garden">
            <img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&q=80&w=600" alt="Vows">
        </div>

        <div class="info-card">
            <p>TOGETHER WITH THEIR FAMILIES</p>
            <p class="highlight-bold">INVITE YOU TO CELEBRATE THEIR UNION</p>
            <p class="venue-name">THE ROYAL GARDEN</p>
            <p class="highlight-bold">SATURDAY, AUGUST 22, 2026</p>
            <p class="highlight-bold">AT 04:00 IN THE AFTERNOON</p>
            <p>AHMEDABAD, GUJARAT, INDIA</p>
            <p style="font-style: italic; margin-top: 25px;">Dinner and Dancing to Follow</p>
        </div>

        <div class="map-section">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3671.583204423851!2d72.545642!3d23.039088!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e84f5096fe371%3A0x13c7c25c61309f92!2sAhmedabad%2C%20Gujarat!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>

        <div class="audio-player">
            <audio controls loop>
                <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
            </audio>
            <p style="font-size: 0.7rem; margin-top: 10px; color: #d4af37;">CLICK PLAY FOR ROMANTIC MUSIC</p>
        </div>
    </div>

</body>
</html>
